name: Test, build installer and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Saved PCAPNG opens in Wireshark
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark > /dev/null
          python - <<'PY'
          from sursum.scanners import pcapwrite, simulated
          s = simulated.SimulatedScanner(); s.t0 -= 100
          nets, _ = s.scan()
          open("scan.pcapng", "wb").write(pcapwrite.write(nets)[0])
          print(len(nets), file=open("count.txt", "w"))
          PY
          test "$(tshark -r scan.pcapng -Y 'wlan.fc.type_subtype==8 && radiotap.channel.freq && wlan.bssid' 2>/dev/null | wc -l)" = "$(cat count.txt)"

  windows-installer:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # to publish the installer as a release
    env:
      APP_VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        shell: pwsh
        run: |
          (Get-Content sursum/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$env:APP_VERSION`"" | Set-Content sursum/__init__.py
      - name: Build program
        run: |
          python -m pip install pyinstaller pywebview anthropic
          pyinstaller --noconfirm --windowed --name SursumWiFiScanner --icon packaging/sursum.ico --add-data "sursum/web;sursum/web" --add-data "sursum/data;sursum/data" run_sursum.py
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          if ($LASTEXITCODE) { throw "installer build failed" }
      - name: Install it and run it (demo mode)
        shell: pwsh
        run: |
          $setup = Start-Process dist\SursumWiFiScanner-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($setup.ExitCode) { throw "setup exit code $($setup.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Stole Sursum WiFi Scanner\SursumWiFiScanner.exe"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Stole Sursum WiFi Scanner.lnk"
          foreach ($f in $exe, $menu, "$env:USERPROFILE\Desktop\Stole Sursum WiFi Scanner.lnk") { if (-not (Test-Path $f)) { throw "missing after install: $f" } }
          $p = Start-Process $exe -ArgumentList "--demo","--selftest" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\dist\app-window.png")
          try { $s = Invoke-RestMethod http://127.0.0.1:8737/api/state } finally { Get-Content "$env:APPDATA\StoleSursum\app.log" -ErrorAction SilentlyContinue }
          $title = (Get-Process -Id $p.Id).MainWindowTitle
          "Window title: '$title'; version $($s.version); $($s.networks.Count) networks"
          Stop-Process -Id $p.Id -Force
          if ($s.networks.Count -lt 10) { throw "demo scan returned $($s.networks.Count) networks" }
          if (-not (Select-String -Path "$env:APPDATA\StoleSursum\app.log" -Pattern "menu bar with 6 menus" -Quiet)) { throw "the app did not open its own window with a menu bar" }
          if (-not (Select-String -Path "$env:APPDATA\StoleSursum\app.log" -Pattern "selftest: tab=spectrum theme=light" -Quiet)) { throw "menu commands do not reach the app" }
          $un = Get-ChildItem "$env:LOCALAPPDATA\Programs\Stole Sursum WiFi Scanner\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left the program behind" }
          "Uninstall removed the program."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SursumWiFiScanner-Setup
          path: |
            dist/SursumWiFiScanner-Setup.exe
            dist/app-window.png
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "Download SursumWiFiScanner-Setup.exe below and run it. Windows may show 'Windows protected your PC' because the installer is not code-signed. Choose More info, then Run anyway."
          gh release create "v$env:APP_VERSION" dist/SursumWiFiScanner-Setup.exe --target "${{ github.sha }}" --title "Stole Sursum WiFi Scanner $env:APP_VERSION" --notes $notes --latest
          if ($LASTEXITCODE) { throw "release failed" }
