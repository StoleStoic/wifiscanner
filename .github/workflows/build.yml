name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone program
        run: |
          python -m pip install pyinstaller anthropic
          pyinstaller --noconfirm --onefile --name SursumWiFiScanner --add-data "sursum/web;sursum/web" --add-data "sursum/data;sursum/data" run_sursum.py
      - name: Smoke test (demo mode)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SursumWiFiScanner.exe -ArgumentList "--demo","--no-browser","--port","8737" -PassThru
          Start-Sleep -Seconds 12
          $s = Invoke-RestMethod http://127.0.0.1:8737/api/state
          Stop-Process -Id $p.Id -Force
          if ($s.networks.Count -lt 10) { throw "demo scan returned $($s.networks.Count) networks" }
          "Demo scan returned $($s.networks.Count) networks"
      - uses: actions/upload-artifact@v4
        with:
          name: SursumWiFiScanner-windows
          path: dist/SursumWiFiScanner.exe
